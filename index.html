<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BCI Deadlines · 脑机接口研究工具箱</title>
<meta name="description" content="Tools for BCI/EEG researchers: conference deadlines, journals, public datasets, an EEG atlas, a starter environment and an artifact simulator. 面向 BCI/EEG 研究者的截稿、期刊、数据集与工具。">
<script>
/* 首页原来就是列表页。带 sub / mode / q 参数的旧链接(README 里写过可分享的筛选 URL)转去列表页,不断链 */
(function(){var p=new URLSearchParams(location.search);if(p.has('sub')||p.has('mode')||p.has('q'))location.replace('deadlines.html'+location.search+location.hash)})();
</script>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧠</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@700;900&family=Noto+Sans+SC:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fafaf8; --bg2:#f2f1ed; --paper:#fff;
  --ink:#2C2C2A; --ink-dim:#5F5E5A; --ink-muted:#8a8a84;
  --hair:#e8e6df; --line-soft:#d6d5cf;
  --orange:#D85A30; --red:#C0473F; --green:#1D9E75;
  --serif:'Noto Serif SC',Georgia,'Songti SC',serif;
  --sans:'Noto Sans SC',-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,monospace;
  --c:#D85A30;
}
*{margin:0;padding:0;box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);font-weight:300;line-height:1.7;font-size:15px;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.wrap{max-width:1000px;margin:0 auto;padding:0 2.4rem}

/* 顶栏:首页只留品牌、语言、GitHub */
.nav{position:sticky;top:0;z-index:50;background:rgba(250,250,248,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--hair)}
.nav-in{max-width:1000px;margin:0 auto;padding:.7rem 2.4rem;display:flex;align-items:center;gap:.55rem}
.brand{font-family:var(--mono);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;font-weight:500;white-space:nowrap}
.brand em{font-style:normal;color:var(--orange)}
.spacer{flex:1}
.tool{font-family:var(--mono);font-size:.68rem;letter-spacing:.04em;color:var(--ink-dim);background:none;border:1px solid var(--hair);padding:.3rem .65rem;cursor:pointer;white-space:nowrap;transition:all .15s}
.tool:hover{border-color:var(--ink-muted);color:var(--ink)}

/* 标题 */
.hero{padding:4.2rem 0 2rem}
.kicker{font-family:var(--mono);font-size:.7rem;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-muted);margin-bottom:1.6rem}
.hero h1{font-family:var(--serif);font-weight:900;font-size:clamp(2rem,5vw,3.4rem);line-height:1.12;letter-spacing:-.02em}
.hero h1 em{font-style:normal;color:var(--orange)}

/* 搜索 */
.sbox{display:flex;align-items:center;gap:.7rem;border:1px solid var(--line-soft);background:var(--paper);padding:0 .9rem;transition:border-color .15s}
.sbox:focus-within{border-color:var(--ink-muted)}
.sbox svg{width:16px;height:16px;fill:var(--ink-muted);flex:0 0 auto}
.sbox input{flex:1;min-width:0;border:0;outline:none;background:none;font-family:var(--sans);font-size:1rem;font-weight:400;color:var(--ink);padding:.85rem 0}
.sbox input::placeholder{color:var(--ink-muted);font-weight:300}
.sbox input::-webkit-search-cancel-button{display:none}
.sbox kbd{font-family:var(--mono);font-size:.62rem;color:var(--ink-muted);border:1px solid var(--hair);padding:.05rem .4rem;border-radius:2px}
.sbox .clr{font-family:var(--mono);font-size:.62rem;letter-spacing:.06em;color:var(--ink-muted);background:none;border:0;cursor:pointer;padding:.2rem 0}
.sbox .clr:hover{color:var(--ink)}

.results{border:1px solid var(--hair);border-top:0;background:var(--paper)}
.rg{padding:.75rem 1rem .55rem;border-top:1px solid var(--hair)}
.rg:first-child{border-top:0}
.rg-head{display:flex;align-items:center;gap:.5rem;font-family:var(--mono);font-size:.6rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-muted);margin-bottom:.3rem}
.rg-head .dot{width:7px;height:7px;border-radius:50%;background:var(--c);flex:0 0 auto}
.rg-head .cnt{color:var(--c)}
.rg-head .all{margin-left:auto;text-transform:none;letter-spacing:.03em;color:var(--ink-dim);border-bottom:1px solid var(--hair)}
.rg-head .all:hover{color:var(--c);border-bottom-color:var(--c)}
.hit{display:grid;grid-template-columns:minmax(0,max-content) minmax(0,1fr) auto;align-items:baseline;gap:.8rem;padding:.42rem .35rem;border-top:1px dashed var(--hair);transition:background .12s}
.rg-head+.hit{border-top:0}
.hit:hover,.hit.kb{background:color-mix(in srgb,var(--c) 7%,transparent)}
.hit-nm{font-family:var(--serif);font-weight:700;font-size:.95rem;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.hit:hover .hit-nm,.hit.kb .hit-nm{color:var(--c)}
.hit-sub{font-size:.8rem;color:var(--ink-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hit-k{font-family:var(--mono);font-size:.62rem;color:var(--ink-dim);white-space:nowrap;font-variant-numeric:tabular-nums}
.hit-k.due{color:var(--red)}
.empty{font-family:var(--mono);font-size:.72rem;color:var(--ink-muted);padding:1.4rem 1rem;text-align:center}

/* 九宫格 */
.hub{margin-top:2.6rem}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--hair);border-left:1px solid var(--hair)}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:.3rem;min-width:0;padding:1.25rem 1.3rem 1.1rem;border-right:1px solid var(--hair);border-bottom:1px solid var(--hair);transition:background .15s,box-shadow .15s,opacity .2s}
.tile-top{display:flex;align-items:center;gap:.6rem;margin-bottom:.5rem}
.tile-ic{width:27px;height:27px;flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;background:var(--c);border-radius:3px}
.tile-ic svg{width:16px;height:16px;fill:#fff}
.tile-no{font-family:var(--mono);font-size:.7rem;letter-spacing:.12em;color:var(--c);font-variant-numeric:tabular-nums}
.tile-nm{font-family:var(--serif);font-weight:700;font-size:1.18rem;line-height:1.3;letter-spacing:-.01em;transition:color .15s}
.tile-sub{font-size:.8rem;color:var(--ink-muted);line-height:1.55}
.tile-k{margin-top:auto;padding-top:.65rem;font-family:var(--mono);font-size:.6rem;letter-spacing:.08em;color:var(--ink-muted);font-variant-numeric:tabular-nums}
.tile:hover{background:color-mix(in srgb,var(--c) 5%,transparent);box-shadow:inset 0 2px 0 var(--c)}
.tile:hover .tile-nm,.tile.hit-on .tile-nm{color:var(--c)}
.tile:hover .tile-k{color:var(--c)}
.tile:focus-visible{outline:2px solid var(--c);outline-offset:-2px}
.tiles.searching .tile:not(.hit-on){opacity:.32}
.tile.hit-on{box-shadow:inset 0 2px 0 var(--c)}

footer{padding:3rem 0 4rem;border-top:1px solid var(--hair);margin-top:3.4rem}
.fnote{font-family:var(--mono);font-size:.64rem;letter-spacing:.03em;color:var(--ink-muted);line-height:2}
.fnote a{color:var(--ink-dim);border-bottom:1px solid var(--hair)}
.fnote a:hover{color:var(--orange);border-bottom-color:var(--orange)}

@media(max-width:680px){
  .wrap,.nav-in{padding-left:1.3rem;padding-right:1.3rem}
  .hero{padding:2.6rem 0 1.4rem}
  .sbox kbd{display:none}
  .hit{grid-template-columns:minmax(0,1fr) auto;row-gap:0}
  .hit-sub{grid-column:1/-1;grid-row:2}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .tile{padding:1rem .9rem .95rem}
  .tile-nm{font-size:1.02rem}
  .tile-sub{font-size:.74rem}
}
</style>
</head>
<body>

<nav class="nav"><div class="nav-in">
  <a class="brand" href="./">🧠 BCI<em>·</em>Deadlines</a>
  <span class="spacer"></span>
  <button class="tool" id="langBtn">EN</button>
  <a class="tool" href="https://github.com/LarryYiGuo/BCI_Conference_Deadlines" target="_blank" rel="noopener">GitHub</a>
</div></nav>

<div class="wrap">
  <header class="hero">
    <div class="kicker">BCI · Conference Deadlines</div>
    <h1 id="h1"></h1>
  </header>

  <div class="finder" role="search">
    <label class="sbox">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.5 3a7.5 7.5 0 015.9 12.1l4.7 4.7-1.4 1.4-4.7-4.7A7.5 7.5 0 1110.5 3zm0 2a5.5 5.5 0 100 11 5.5 5.5 0 000-11z"/></svg>
      <input id="q" type="search" autocomplete="off" spellcheck="false" aria-controls="results">
      <button class="clr" id="clr" type="button" hidden></button>
      <kbd>/</kbd>
    </label>
    <div class="results" id="results" hidden></div>
  </div>

  <section class="hub" aria-label="Tools"><div class="tiles" id="tiles"></div></section>

  <footer><div class="fnote" id="fnote"></div></footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
<script src="static/hub.js?v=20261009-1"></script>
</body>
</html>
